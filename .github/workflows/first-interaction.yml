name: Greet first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first BRUTAL issue! 👋

            We're a small team, so please be patient with us. It may be a while before someone replies. To help us:
            - **Questions and "how do I…?"** belong on the [BRUTAL forums](https://forums.ahwoo.dev/forums/brutal/). We may close and redirect them.
            - **Bugs:** please make sure you've included package versions, OS/GPU, and a minimal repro.
            - **Security issues:** please don't post them here. See [SECURITY.md](../blob/main/SECURITY.md).
          pr-message: |
            Thanks for your first pull request to BRUTAL! 👋

            Before we can review it:
            - It should be linked to an issue where a maintainer has agreed the approach (tiny doc and typo fixes excepted).
            - Every commit needs a DCO sign-off (`git commit -s`). By contributing you agree to section 5.0 of the BRUTAL License.
            - If a substantial part is AI-generated, please say so. You need to understand and have tested every line.

            BRUTAL's scope is deliberately small, so we may decline changes that add engine-style features. Please read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). We're a small team and reviews may take a while, so thanks for your patience.
